<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Church Street Vendor App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Outfit:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Kannada:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&family=Noto+Sans+Bengali:wght@400;600&display=swap">
<style>
:root{--bg:#F6EEDF;--card:#FFFAF0;--ink:#2E1D17;--mute:#6B5547;--line:#E3D3B8;--o:#F2A62E;--p:#C4707F;--g:#8A9A5E;--b:#E3C99B;--n:#0A2160;--road:#FFFAF0;--blk:#EBDDC2;--park:#C9D3A8;--acc:var(--p);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E1511;--card:#2A1D17;--ink:#F6EBDD;--mute:#CDB9A5;--line:#4A372D;--road:#4A372D;--blk:#33241D;--park:#3A4226}}
:root[data-theme="dark"]{--bg:#1E1511;--card:#2A1D17;--ink:#F6EBDD;--mute:#CDB9A5;--line:#4A372D;--road:#4A372D;--blk:#33241D;--park:#3A4226}
#app[data-role=v]{--acc:var(--g)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.4 Outfit,system-ui,sans-serif;display:flex;justify-content:center;align-items:center;padding:12px}
h1,h2,h3,.h{font-family:Montserrat,system-ui,sans-serif;margin:0}
.app{position:relative;width:100%;max-width:400px;height:min(820px,100%);background:var(--bg);border:1px solid var(--line);border-radius:26px;overflow:hidden;display:flex;flex-direction:column}
.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 6px}
.logo{font:800 15px Montserrat,sans-serif}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px}
.seg button{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink);border-radius:99px;padding:3px 10px 3px 3px;font:600 12px Outfit;cursor:pointer}
.seg button.on{background:var(--acc);color:#2E1D17}
.seg svg{width:30px;height:30px;flex:none}
.body{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;overflow:auto;padding:4px 14px 14px}
.nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
.nav button{flex:1;border:0;background:none;color:var(--mute);padding:8px 0 9px;font:500 11px Outfit;cursor:pointer;position:relative}
.nav button.on{color:var(--ink);font-weight:600}
.nav .n{position:absolute;top:3px;right:22%;background:var(--p);color:#2E1D17;border-radius:99px;font-size:10px;padding:0 5px}
.in{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font:14px Outfit}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 14px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 12px;font:500 12px Outfit;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.mw{flex:1;min-height:0;position:relative}
#ms{height:100%;overflow:auto}svg{display:block;width:100%;height:auto}
.pin{cursor:pointer}.dim{opacity:.2;pointer-events:none}.cp{cursor:pointer}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px;transform:translateY(105%);transition:transform .25s;box-shadow:0 -8px 24px rgba(0,0,0,.15);max-height:75%;overflow:auto}
.sheet.show{transform:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.badge{display:inline-block;font:600 11px Outfit;padding:3px 9px;border-radius:99px;color:#fff}
.btn{border:0;background:var(--o);color:#2E1D17;border-radius:11px;padding:9px 13px;font:600 13px Outfit;cursor:pointer}
.btn.g{background:none;border:1px solid var(--line);color:var(--ink)}.btn:disabled{opacity:.4}
.x{border:0;background:none;color:var(--mute);font-size:22px;cursor:pointer;line-height:1}
.ph{object-fit:cover;border-radius:12px;display:block}
.ph0{border-radius:12px;background:var(--b);color:#2E1D17;display:flex;align-items:center;justify-content:center;font:800 28px Montserrat}
.kv{display:grid;grid-template-columns:70px 1fr;gap:3px 8px;margin:10px 0;font-size:13px}.kv span:nth-child(odd){color:var(--mute)}
.mod{position:absolute;inset:0;background:rgba(5,8,30,.55);display:flex;align-items:flex-end;z-index:5}
.mc{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:14px;max-height:100%;overflow:auto}
.q{display:flex;align-items:center;gap:8px}.q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;cursor:pointer}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:500 14px Outfit;cursor:pointer}
.opt.on{border:2px solid var(--o)}
.mute{color:var(--mute);font-size:12px}.st{width:46px;height:46px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:20px}.st.on{border:2px solid var(--g);background:var(--g);color:#2E1D17}
.bar2{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.bar2 i{display:block;height:100%;background:var(--o)}
.hero{display:flex;gap:12px;align-items:center;margin:2px 14px 6px;padding:8px 12px;border-radius:18px;background:color-mix(in srgb,var(--acc) 24%,var(--card));border:2px solid var(--acc)}
.hero svg{width:52px;height:52px;flex:none}.hero b{font:800 16px Montserrat,sans-serif}
.gear{border:1px solid var(--line);background:var(--card);color:var(--ink);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pill{display:flex;justify-content:center;align-items:center;height:28px;width:44px;margin:0 auto 2px;border-radius:99px}.nav button.on .pill{background:var(--acc);color:#2E1D17}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.arch{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border:2px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);cursor:pointer;font:14px Outfit}
.arch.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 22%,var(--card))}.big svg{width:84px;height:84px}
.lb{display:block;margin:12px 0 4px;font-weight:600;font-size:13px}.tg{display:flex;gap:6px}.tg button{flex:1}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.sw i{width:40px;height:22px;border-radius:99px;background:var(--line);position:relative;display:block}.sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--card);transition:.15s}.sw.on i{background:var(--g)}.sw.on i::after{left:21px}
:root{--sf:"Noto Sans Devanagari","Noto Sans Kannada","Noto Sans Tamil","Noto Sans Telugu","Noto Sans Bengali",system-ui,sans-serif}
body,button,input,select,.badge,.chip,.opt,.arch,.btn,.in,.seg button,.nav button{font-family:Outfit,var(--sf)}
h1,h2,h3,.h,.logo,.hero b{font-family:Montserrat,var(--sf)}
.fb{position:absolute;left:8px;right:8px;top:8px;z-index:3;display:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 36px 8px 12px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.fb .x{position:absolute;right:6px;top:4px}.fb .btn{margin-top:4px;padding:5px 10px}
.btn.g.on{background:var(--acc);color:#2E1D17;border-color:var(--acc)}
/* first-run tour */
.tour{position:absolute;inset:0;z-index:9;background:rgba(5,8,30,.6);display:flex;align-items:flex-end}
.tc{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:18px 16px 16px;text-align:center}
.tc>svg:first-child{width:64px;height:64px;margin:0 auto}
.tic{width:52px;height:52px;margin:10px auto 6px;border-radius:50%;background:color-mix(in srgb,var(--acc) 26%,var(--card));display:flex;align-items:center;justify-content:center}
.tic svg{width:26px;height:26px}
.tc h2{font-size:19px;margin:4px 0}.tc p{margin:0 0 12px;color:var(--mute);font-size:14px}
.dots{display:flex;justify-content:center;gap:6px;margin-bottom:14px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--acc);width:20px;border-radius:4px}
</style></head><body><div class="app" id="app"></div>

"Saved on this device. Real alerts need a backend and a push service.":["इस डिवाइस पर सहेजा गया। असली अलर्ट के लिए बैकएंड और पुश सेवा चाहिए।","ಈ ಸಾಧನದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ. ನಿಜವಾದ ಅಲರ್ಟ್‌ಗಳಿಗೆ ಬ್ಯಾಕೆಂಡ್ ಮತ್ತು ಪುಶ್ ಸೇವೆ ಬೇಕು.","இந்தச் சாதனத்தில் சேமிக்கப்பட்டது. உண்மையான அறிவிப்புகளுக்கு பேக்எண்டும் புஷ் சேவையும் தேவை.","ఈ పరికరంలో సేవ్ చేయబడింది. నిజమైన అలర్ట్‌లకు బ్యాకెండ్, పుష్ సర్వీస్ కావాలి.","এই ডিভাইসে সংরক্ষিত। আসল অ্যালার্টের জন্য ব্যাকএন্ড ও পুশ সার্ভিস লাগবে।","या डिव्हाइसवर जतन केले. खऱ्या अलर्टसाठी बॅकएंड आणि पुश सेवा लागेल."],

"Coco’s café → three stalls → the bookshop. Check in at each stall to collect a stamp.":["कोको’ज़ कैफ़े → तीन दुकानें → बुकशॉप। स्टैम्प पाने के लिए हर दुकान पर चेक-इन करें।","ಕೋಕೋಸ್ ಕೆಫೆ → ಮೂರು ಅಂಗಡಿಗಳು → ಪುಸ್ತಕದ ಅಂಗಡಿ. ಸ್ಟ್ಯಾಂಪ್ ಪಡೆಯಲು ಪ್ರತಿ ಅಂಗಡಿಯಲ್ಲಿ ಚೆಕ್-ಇನ್ ಮಾಡಿ.","கோகோஸ் கஃபே → மூன்று கடைகள் → புத்தகக் கடை. முத்திரை பெற ஒவ்வொரு கடையிலும் செக்-இன் செய்யுங்கள்.","కోకోస్ కేఫ్ → మూడు దుకాణాలు → పుస్తకాల దుకాణం. స్టాంప్ పొందడానికి ప్రతి దుకాణంలో చెక్-ఇన్ చేయండి.","কোকোস ক্যাফে → তিনটি দোকান → বইয়ের দোকান। স্ট্যাম্প পেতে প্রতিটি দোকানে চেক-ইন করুন।","कोकोज कॅफे → तीन दुकाने → पुस्तकाचे दुकान. स्टॅम्प मिळवण्यासाठी प्रत्येक दुकानात चेक-इन करा."],

"Visit all three stalls to unlock a vendor-funded reward.":["विक्रेताओं के इनाम के लिए तीनों दुकानों पर जाएँ।","ವ್ಯಾಪಾರಿಗಳ ಬಹುಮಾನ ಪಡೆಯಲು ಮೂರೂ ಅಂಗಡಿಗಳಿಗೆ ಭೇಟಿ ನೀಡಿ.","வியாபாரிகள் வழங்கும் பரிசைப் பெற மூன்று கடைகளுக்கும் செல்லுங்கள்.","వ్యాపారుల బహుమతి పొందడానికి మూడు దుకాణాలనూ సందర్శించండి.","বিক্রেতাদের পুরস্কার পেতে তিনটি দোকানেই যান।","विक्रेत्यांचे बक्षीस मिळवण्यासाठी तिन्ही दुकानांना भेट द्या."],

"Leftover stock at a discount, posted by vendors. Reserve it and collect at the stall.":["बचा हुआ माल छूट पर, विक्रेताओं द्वारा पोस्ट किया गया। आरक्षित करें और दुकान से लें।","ವ್ಯಾಪಾರಿಗಳು ಹಾಕಿದ ಉಳಿದ ಸರಕು ರಿಯಾಯಿತಿಯಲ್ಲಿ. ಕಾಯ್ದಿರಿಸಿ ಮತ್ತು ಅಂಗಡಿಯಲ್ಲಿ ಪಡೆಯಿರಿ.","வியாபாரிகள் பதிவிட்ட மீதமுள்ள பொருட்கள் தள்ளுபடியில். முன்பதிவு செய்து கடையில் பெறுங்கள்.","వ్యాపారులు పోస్ట్ చేసిన మిగిలిన సరుకు తగ్గింపుతో. రిజర్వ్ చేసి దుకాణంలో తీసుకోండి.","বিক্রেতাদের দেওয়া বাড়তি মাল ছাড়ে। রিজার্ভ করে দোকানে নিন।","विक्रेत्यांनी टाकलेला उरलेला माल सवलतीत. राखून ठेवा आणि दुकानातून घ्या."],

"Can’t find something? Ask. Vendors see it and can stock it.":["कुछ नहीं मिल रहा? पूछें। विक्रेता देखकर उसे रख सकते हैं।","ಏನಾದರೂ ಸಿಗುತ್ತಿಲ್ಲವೇ? ಕೇಳಿ. ವ್ಯಾಪಾರಿಗಳು ನೋಡಿ ಸ್ಟಾಕ್ ಮಾಡಬಹುದು.","ஏதாவது கிடைக்கவில்லையா? கேளுங்கள். வியாபாரிகள் பார்த்து வாங்கி வைக்கலாம்.","ఏదైనా దొరకలేదా? అడగండి. వ్యాపారులు చూసి స్టాక్ చేయవచ్చు.","কিছু খুঁজে পাচ্ছেন না? জিজ্ঞাসা করুন। বিক্রেতারা দেখে স্টক করতে পারেন।","काही सापडत नाही? विचारा. विक्रेते पाहून ठेवू शकतात."],

"Posts tagged to stalls. Only tags the vendor approved show up here.":["दुकानों से टैग किए गए पोस्ट। यहाँ सिर्फ़ विक्रेता द्वारा मंज़ूर टैग दिखते हैं।","ಅಂಗಡಿಗಳಿಗೆ ಟ್ಯಾಗ್ ಮಾಡಿದ ಪೋಸ್ಟ್‌ಗಳು. ವ್ಯಾಪಾರಿ ಅನುಮೋದಿಸಿದ ಟ್ಯಾಗ್‌ಗಳು ಮಾತ್ರ ಇಲ್ಲಿ ಕಾಣುತ್ತವೆ.","கடைகளுக்கு குறிக்கப்பட்ட பதிவுகள். வியாபாரி ஒப்புக்கொண்ட குறிச்சொற்கள் மட்டுமே இங்கே தெரியும்.","దుకాణాలకు ట్యాగ్ చేసిన పోస్టులు. వ్యాపారి ఆమోదించిన ట్యాగ్‌లు మాత్రమే ఇక్కడ కనిపిస్తాయి.","দোকানে ট্যাগ করা পোস্ট। শুধু বিক্রেতার অনুমোদিত ট্যাগ এখানে দেখা যায়।","दुकानांना टॅग केलेल्या पोस्ट. फक्त विक्रेत्याने मंजूर केलेले टॅग येथे दिसतात."],

"No reservations yet. Try reserving from the Explorer side.":["अभी कोई आरक्षण नहीं। एक्सप्लोरर की ओर से आरक्षित करके देखें।","ಇನ್ನೂ ಕಾಯ್ದಿರಿಸುವಿಕೆ ಇಲ್ಲ. ಎಕ್ಸ್‌ಪ್ಲೋರರ್ ಕಡೆಯಿಂದ ಕಾಯ್ದಿರಿಸಿ ನೋಡಿ.","இன்னும் முன்பதிவுகள் இல்லை. எக்ஸ்ப்ளோரர் பக்கத்தில் முன்பதிவு செய்து பாருங்கள்.","ఇంకా రిజర్వేషన్లు లేవు. ఎక్స్‌ప్లోరర్ వైపు నుండి రిజర్వ్ చేసి చూడండి.","এখনও কোনো রিজার্ভেশন নেই। এক্সপ্লোরার দিক থেকে রিজার্ভ করে দেখুন।","अजून राखीव नाही. एक्सप्लोरर बाजूने राखून पहा."],

TT["Tap a pin to see what a stall sells, whether it is open and how to spot it. Search or filter by product."]=["पिन पर टैप करें और देखें कि दुकान क्या बेचती है, खुली है या नहीं और उसे कैसे पहचानें। सामान से खोजें या फ़िल्टर करें।","ಪಿನ್ ಮೇಲೆ ಟ್ಯಾಪ್ ಮಾಡಿ: ಅಂಗಡಿ ಏನು ಮಾರುತ್ತದೆ, ತೆರೆದಿದೆಯೇ, ಹೇಗೆ ಗುರುತಿಸುವುದು ಎಂದು ನೋಡಿ. ಉತ್ಪನ್ನದ ಮೂಲಕ ಹುಡುಕಿ ಅಥವಾ ಫಿಲ್ಟರ್ ಮಾಡಿ.","பின்னைத் தட்டினால் கடை என்ன விற்கிறது, திறந்திருக்கிறதா, எப்படி அடையாளம் காண்பது என்று தெரியும். பொருளின் மூலம் தேடலாம் அல்லது வடிகட்டலாம்.","పిన్‌ను నొక్కితే దుకాణం ఏమి అమ్ముతుందో, తెరిచి ఉందో లేదో, ఎలా గుర్తించాలో తెలుస్తుంది. ఉత్పత్తి ద్వారా వెతకండి లేదా ఫిల్టర్ చేయండి.","পিনে ট্যাপ করে দেখুন দোকান কী বিক্রি করে, খোলা কি না, আর কীভাবে চিনবেন। পণ্য দিয়ে খুঁজুন বা ফিল্টার করুন।","पिनवर टॅप करा आणि दुकान काय विकते, उघडे आहे का आणि कसे ओळखायचे ते पहा. वस्तूने शोधा किंवा फिल्टर करा."];
